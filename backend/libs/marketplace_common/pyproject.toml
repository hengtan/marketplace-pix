[project]
name = "marketplace-common"
version = "0.1.0"
description = "Shared messaging, observability and DLQ tooling for the marketplace services"
authors = [
    { name = "hengtan", email = "hengjt1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.15.0"]
sqlalchemy = ["opentelemetry-instrumentation-sqlalchemy>=0.51b0"]
redis = [
    "redis>=5.2.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiokafka>=0.15.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "redis>=5.2.0",
    "ruff>=0.17.4",
    "sqlalchemy[asyncio]>=2.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
