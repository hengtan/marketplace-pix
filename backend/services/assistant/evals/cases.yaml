# Cada caso roda a pergunta de ponta a ponta (agente, recuperação e geração).
# expected_products: slugs esperados entre os 3 primeiros trechos recuperados.
# expected_tool: ferramenta que o agente deve usar ("none" = nenhuma).
# must_include / must_not_include: afirmações obrigatórias e proibidas na resposta.
# history: mensagens anteriores da mesma conversa (para testar a memória).

- id: fone-cancelamento-ruido
  question: "quero um fone com cancelamento de ruído"
  expected_products: [fone-bluetooth-nova]
  expected_tool: search_products
  must_include: ["Fone Bluetooth Nova ANC"]

