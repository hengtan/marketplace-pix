[project]
name = "notifications"
version = "0.1.0"
description = "Notifications service: transactional e-mails with Celery, inbox consumer and Jinja2 templates"
authors = [
    { name = "hengtan", email = "hengjt1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.15.0",
    "aiosmtplib>=3.0.2",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.5.3",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "celery", "celery.*", "aiosmtpd", "aiosmtpd.*"]
ignore_missing_imports = true
