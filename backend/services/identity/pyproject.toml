[project]
name = "identity"
version = "0.1.0"
description = "Identity service: registration, login, JWT access tokens (EdDSA), rotating refresh tokens and JWKS"
authors = [
    { name = "hengtan", email = "hengjt1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "marketplace-common[sqlalchemy]",
    "prometheus-client>=0.21.0",
    "alembic>=1.20.1",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=44.0.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
marketplace-common = { path = "../../libs/marketplace_common", editable = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
strict = true
mypy_path = "src"
