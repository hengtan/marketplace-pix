name: marketplace-pix

x-ordering: &ordering
  build:
    context: ..
    dockerfile: backend/services/ordering/Dockerfile
  image: marketplace-pix/ordering:dev
  profiles: ["services"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    CATALOG_URL: http://catalog-api:8000

x-payments: &payments
  build:
    context: ..
    dockerfile: backend/services/payments/Dockerfile
  image: marketplace-pix/payments:dev
  profiles: ["services"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET}
    ENABLE_DEV_PSP: "true"
    PIX_TTL_MINUTES: ${PIX_TTL_MINUTES:-30}

x-catalog: &catalog
  build:
    context: ..
    dockerfile: backend/services/catalog/Dockerfile
  image: marketplace-pix/catalog:dev
  profiles: ["services"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    CATALOG_DB: catalog

x-ledger: &ledger
  build:
    context: ..
    dockerfile: backend/services/ledger/Dockerfile
  image: marketplace-pix/ledger:dev
  profiles: ["services"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    LEDGER_DB: ledger
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-inventory: &inventory
  build:
    context: ..
    dockerfile: backend/services/inventory/Dockerfile
  image: marketplace-pix/inventory:dev
  profiles: ["services"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    INVENTORY_DB: inventory
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-notifications: &notifications
  build:
    context: ..
    dockerfile: backend/services/notifications/Dockerfile
  image: marketplace-pix/notifications:dev
  profiles: ["services"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    NOTIFICATIONS_DB: notifications
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    MAIL_FROM: "Marketplace PIX <no-reply@marketplace-pix.local>"
    ADMIN_EMAIL: admin@marketplace-pix.local
    FRONTEND_BASE_URL: http://localhost:5173

x-assistant: &assistant
  build:
    context: ..
    dockerfile: backend/services/assistant/Dockerfile
  image: marketplace-pix/assistant:dev
  profiles: ["services"]
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: pgvector
    ASSISTANT_DB_PORT: 5432
    ASSISTANT_DB: assistant
    CATALOG_URL: http://catalog-api:8000
    INVENTORY_URL: http://inventory-api:8000
    ORDERING_URL: http://ordering-api:8000
    EMBEDDER: hashing
    LLM: mock

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: assistant
    ports:
      - "${PGVECTOR_PORT:-5434}:5432"
    volumes:
      - pgvectordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in orders.events payments.events inventory.events ledger.events orders.events.dlq payments.events.dlq inventory.events.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"

  ordering-migrate:
    <<: *ordering
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ordering-api:
    <<: *ordering
    ports:
      - "${ORDERING_PORT:-8001}:8000"
    depends_on:
      ordering-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  ordering-relay:
    <<: *ordering
    command: ["python", "-m", "ordering.relay_main"]
    depends_on:
      ordering-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  ordering-worker:
    <<: *ordering
    command: ["python", "-m", "ordering.worker_main"]
    depends_on:
      ordering-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  payments-migrate:
    <<: *payments
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payments-api:
    <<: *payments
    ports:
      - "${PAYMENTS_PORT:-8002}:8000"
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  payments-worker:
    <<: *payments
    command: ["python", "-m", "payments.worker_main"]
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  payments-relay:
    <<: *payments
    command: ["python", "-m", "payments.relay_main"]
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  catalog-migrate:
    <<: *catalog
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  catalog-seed:
    <<: *catalog
    command: ["python", "-m", "catalog.seed"]
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    restart: "no"

  catalog-api:
    <<: *catalog
    ports:
      - "${CATALOG_PORT:-8003}:8000"
    depends_on:
      catalog-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  ledger-migrate:
    <<: *ledger
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ledger-api:
    <<: *ledger
    ports:
      - "${LEDGER_PORT:-8005}:8000"
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  ledger-worker:
    <<: *ledger
    command: ["python", "-m", "ledger.worker_main"]
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  ledger-relay:
    <<: *ledger
    command: ["python", "-m", "ledger.relay_main"]
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  inventory-migrate:
    <<: *inventory
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  inventory-seed:
    <<: *inventory
    command: ["python", "-m", "inventory.seed"]
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    restart: "no"

  inventory-api:
    <<: *inventory
    ports:
      - "${INVENTORY_PORT:-8004}:8000"
    depends_on:
      inventory-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  inventory-worker:
    <<: *inventory
    command: ["python", "-m", "inventory.worker_main"]
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  inventory-relay:
    <<: *inventory
    command: ["python", "-m", "inventory.relay_main"]
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  notifications-migrate:
    <<: *notifications
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  notifications-api:
    <<: *notifications
    ports:
      - "${NOTIFICATIONS_PORT:-8006}:8000"
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  notifications-worker:
    <<: *notifications
    command: ["python", "-m", "notifications.worker_main"]
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  notifications-celery:
    <<: *notifications
    command: ["celery", "-A", "notifications.worker.celery_app", "worker", "-l", "info"]
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  notifications-beat:
    <<: *notifications
    command: ["celery", "-A", "notifications.worker.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  assistant-migrate:
    <<: *assistant
    command: ["alembic", "upgrade", "head"]
    depends_on:
      pgvector:
        condition: service_healthy
    restart: "no"

  assistant-ingest:
    <<: *assistant
    command: ["python", "-m", "assistant.ingest"]
    depends_on:
      assistant-migrate:
        condition: service_completed_successfully
      catalog-api:
        condition: service_healthy
    restart: "no"

  assistant-api:
    <<: *assistant
    ports:
      - "${ASSISTANT_PORT:-8007}:8000"
    depends_on:
      assistant-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6

  gateway:
    build:
      context: ..
      dockerfile: backend/gateway/Dockerfile
    image: marketplace-pix/gateway:dev
    profiles: ["services"]
    environment:
      CATALOG_URL: http://catalog-api:8000
      INVENTORY_URL: http://inventory-api:8000
      ORDERING_URL: http://ordering-api:8000
      PAYMENTS_URL: http://payments-api:8000
      LEDGER_URL: http://ledger-api:8000
      NOTIFICATIONS_URL: http://notifications-api:8000
      ASSISTANT_URL: http://assistant-api:8000
      ENABLE_DEV_ROUTES: "true"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      RATE_LIMIT_ROUTES:
      RATE_LIMIT_FAILURE_MODE: ${RATE_LIMIT_FAILURE_MODE:-fallback}
      BREAKER_OPEN_SECONDS: ${BREAKER_OPEN_SECONDS:-10}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ../frontend
      args:
        VITE_ENABLE_DEV_TOOLS: "true"
    image: marketplace-pix/frontend:dev
    profiles: ["services"]
    environment:
      API_UPSTREAM: http://gateway:8000
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  pgvectordata:
  kafkadata:
