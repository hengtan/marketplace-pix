rule_files:
  - ../rules/resilience-slo.yml

evaluation_interval: 1m

tests:
  - name: erro de 10 por cento por 90 minutos dispara a queima rápida de disponibilidade
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",status="200",route="/api/{path:path}",method="GET"}'
        values: "0+90x120"
      - series: 'http_requests_total{service="gateway",status="503",route="/api/{path:path}",method="GET"}'
        values: "0+10x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GatewayAvailabilityBurnRateFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "Queima rápida do orçamento de erro (disponibilidade) no gateway"
              description: "O orçamento de disponibilidade do gateway está sendo consumido 14,4 vezes mais rápido que o sustentável (1h e 5m). Em cerca de 2 dias o orçamento do mês acabaria."

  - name: tráfego saudável com 0,1 por cento de erro não alerta
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",status="200",route="/api/{path:path}",method="GET"}'
        values: "0+999x120"
      - series: 'http_requests_total{service="gateway",status="500",route="/api/{path:path}",method="GET"}'
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: GatewayAvailabilityBurnRateFast
        exp_alerts: []
      - eval_time: 100m
        alertname: GatewayAvailabilityBurnRateSlow
        exp_alerts: []

  - name: 90 por cento das respostas acima de 500 ms dispara a queima rápida de latência
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{service="gateway",le="0.5",route="/x",method="GET"}'
        values: "0+10x120"
      - series: 'http_request_duration_seconds_count{service="gateway",route="/x",method="GET"}'
        values: "0+100x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GatewayLatencyBurnRateFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: latency
            exp_annotations:
              summary: "Queima rápida do orçamento de erro (latência) no gateway"
              description: "O orçamento de latência do gateway está sendo consumido 14,4 vezes mais rápido que o sustentável (1h e 5m). Em cerca de 2 dias o orçamento do mês acabaria."

  - name: breaker aberto por mais de um minuto vira alerta e fallback do Redis vira ticket
    interval: 1m
    input_series:
      - series: 'resilience_circuit_breaker_state{name="catalog",state="open"}'
        values: "0 0 1 1 1 1 1 1"
      - series: 'resilience_circuit_breaker_state{name="catalog",state="closed"}'
        values: "1 1 0 0 0 0 0 0"
      - series: 'resilience_rate_limit_backend_total{backend="memory_fallback"}'
        values: "0 0 0 10 20 30 40 50"
    alert_rule_test:
      - eval_time: 6m
        alertname: CircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: page
              name: catalog
            exp_annotations:
              summary: "Circuit breaker catalog aberto"
              description: "A dependência catalog está sendo rejeitada pelo disjuntor há mais de 1 minuto. O gateway responde 503 com Retry-After."
      - eval_time: 1m
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 7m
        alertname: RateLimiterRedisDegraded
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "Rate limiter operando sem Redis"
              description: "O limite de requisições caiu para o fallback (memória por instância, fail-open ou fail-closed). Os limites deixam de ser globais."
