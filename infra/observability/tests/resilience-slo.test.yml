rule_files:
  - ../rules/resilience-slo.yml

evaluation_interval: 1m

tests:
  - name: a 10 percent error rate for 90 minutes triggers the fast availability burn
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",status="200",route="/api/{path:path}",method="GET"}'
        values: "0+90x120"
      - series: 'http_requests_total{service="gateway",status="503",route="/api/{path:path}",method="GET"}'
        values: "0+10x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GatewayAvailabilityBurnRateFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "Fast error budget burn (availability) at the gateway"
              description: "The gateway availability budget is being consumed 14.4 times faster than sustainable (1h and 5m). The monthly budget would run out in about 2 days."

  - name: healthy traffic with a 0.1 percent error rate does not alert
    interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",status="200",route="/api/{path:path}",method="GET"}'
        values: "0+999x120"
      - series: 'http_requests_total{service="gateway",status="500",route="/api/{path:path}",method="GET"}'
        values: "0+1x120"
    alert_rule_test:
      - eval_time: 100m
        alertname: GatewayAvailabilityBurnRateFast
        exp_alerts: []
      - eval_time: 100m
        alertname: GatewayAvailabilityBurnRateSlow
        exp_alerts: []

  - name: 90 percent of responses above 500 ms trigger the fast latency burn
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{service="gateway",le="0.5",route="/x",method="GET"}'
        values: "0+10x120"
      - series: 'http_request_duration_seconds_count{service="gateway",route="/x",method="GET"}'
        values: "0+100x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: GatewayLatencyBurnRateFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: latency
            exp_annotations:
              summary: "Fast error budget burn (latency) at the gateway"
              description: "The gateway latency budget is being consumed 14.4 times faster than sustainable (1h and 5m). The monthly budget would run out in about 2 days."

  - name: breaker aberto por mais de um minuto vira alerta e fallback do Redis vira ticket
    interval: 1m
    input_series:
      - series: 'resilience_circuit_breaker_state{name="catalog",state="open"}'
        values: "0 0 1 1 1 1 1 1"
      - series: 'resilience_circuit_breaker_state{name="catalog",state="closed"}'
        values: "1 1 0 0 0 0 0 0"
      - series: 'resilience_rate_limit_backend_total{backend="memory_fallback"}'
        values: "0 0 0 10 20 30 40 50"
    alert_rule_test:
      - eval_time: 6m
        alertname: CircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: page
              name: catalog
            exp_annotations:
              summary: "Circuit breaker catalog aberto"
              description: "The catalog dependency has been rejected by the circuit breaker for over 1 minute. The gateway answers 503 with Retry-After."
      - eval_time: 1m
        alertname: CircuitBreakerOpen
        exp_alerts: []
      - eval_time: 7m
        alertname: RateLimiterRedisDegraded
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "Rate limiter operando sem Redis"
              description: "The rate limiter fell back (per-instance memory, fail-open or fail-closed). Limits are no longer global."
