global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: gateway
          component: api

  - job_name: catalog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-api:8000"]
        labels:
          service: catalog
          component: api

  - job_name: catalog-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-relay:9100"]
        labels:
          service: catalog
          component: relay

  - job_name: assistant-api
    metrics_path: /metrics
    static_configs:
      - targets: ["assistant-api:8000"]
        labels:
          service: assistant
          component: api

  - job_name: ordering-api
    metrics_path: /metrics
    static_configs:
