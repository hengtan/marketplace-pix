groups:
  - name: slo-gateway-recording
    interval: 30s
    rules:
      - record: slo:gateway_error_ratio:rate5m
        expr: |
          sum(rate(http_requests_total{service="gateway",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total{service="gateway"}[5m])), 1e-9)
      - record: slo:gateway_error_ratio:rate30m
        expr: |
          sum(rate(http_requests_total{service="gateway",status=~"5.."}[30m]))
          /
          clamp_min(sum(rate(http_requests_total{service="gateway"}[30m])), 1e-9)
      - record: slo:gateway_error_ratio:rate1h
        expr: |
          sum(rate(http_requests_total{service="gateway",status=~"5.."}[1h]))
          /
          clamp_min(sum(rate(http_requests_total{service="gateway"}[1h])), 1e-9)
      - record: slo:gateway_error_ratio:rate2h
        expr: |
          sum(rate(http_requests_total{service="gateway",status=~"5.."}[2h]))
          /
          clamp_min(sum(rate(http_requests_total{service="gateway"}[2h])), 1e-9)
      - record: slo:gateway_error_ratio:rate6h
        expr: |
          sum(rate(http_requests_total{service="gateway",status=~"5.."}[6h]))
          /
          clamp_min(sum(rate(http_requests_total{service="gateway"}[6h])), 1e-9)
      - record: slo:gateway_error_ratio:rate1d
        expr: |
          sum(rate(http_requests_total{service="gateway",status=~"5.."}[1d]))
          /
          clamp_min(sum(rate(http_requests_total{service="gateway"}[1d])), 1e-9)
      - record: slo:gateway_slow_ratio:rate5m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{service="gateway",le="0.5"}[5m]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{service="gateway"}[5m])), 1e-9)
          )
      - record: slo:gateway_slow_ratio:rate30m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{service="gateway",le="0.5"}[30m]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{service="gateway"}[30m])), 1e-9)
          )
      - record: slo:gateway_slow_ratio:rate1h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{service="gateway",le="0.5"}[1h]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{service="gateway"}[1h])), 1e-9)
          )
      - record: slo:gateway_slow_ratio:rate2h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{service="gateway",le="0.5"}[2h]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{service="gateway"}[2h])), 1e-9)
          )
      - record: slo:gateway_slow_ratio:rate6h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{service="gateway",le="0.5"}[6h]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{service="gateway"}[6h])), 1e-9)
          )
      - record: slo:gateway_slow_ratio:rate1d
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{service="gateway",le="0.5"}[1d]))
            /
            clamp_min(sum(rate(http_request_duration_seconds_count{service="gateway"}[1d])), 1e-9)
          )

  - name: slo-gateway-burn-rate
    rules:
      - alert: GatewayAvailabilityBurnRateFast
        expr: |
          slo:gateway_error_ratio:rate1h > (14.4 * 0.005)
          and
          slo:gateway_error_ratio:rate5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Fast error budget burn (availability) at the gateway"
          description: "The gateway availability budget is being consumed 14.4 times faster than sustainable (1h and 5m). The monthly budget would run out in about 2 days."
      - alert: GatewayAvailabilityBurnRateSlow
        expr: |
          slo:gateway_error_ratio:rate6h > (6 * 0.005)
          and
          slo:gateway_error_ratio:rate30m > (6 * 0.005)
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "Sustained error budget burn (availability) at the gateway"
          description: "The availability budget is being consumed 6 times faster than sustainable (6h and 30m)."
      - alert: GatewayAvailabilityBurnRateTicket
        expr: |
          slo:gateway_error_ratio:rate1d > (3 * 0.005)
          and
          slo:gateway_error_ratio:rate2h > (3 * 0.005)
        for: 2m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: "Slow error budget burn (availability) at the gateway"
          description: "The availability budget is being consumed 3 times faster than sustainable (1d and 2h). Open a ticket and investigate."
      - alert: GatewayLatencyBurnRateFast
        expr: |
          slo:gateway_slow_ratio:rate1h > (14.4 * 0.05)
          and
          slo:gateway_slow_ratio:rate5m > (14.4 * 0.05)
        for: 2m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "Fast error budget burn (latency) at the gateway"
          description: "The gateway latency budget is being consumed 14.4 times faster than sustainable (1h and 5m). The monthly budget would run out in about 2 days."
      - alert: GatewayLatencyBurnRateSlow
        expr: |
          slo:gateway_slow_ratio:rate6h > (6 * 0.05)
          and
          slo:gateway_slow_ratio:rate30m > (6 * 0.05)
        for: 2m
        labels:
          severity: page
          slo: latency
        annotations:
          summary: "Sustained error budget burn (latency) at the gateway"
          description: "The latency budget is being consumed 6 times faster than sustainable (6h and 30m)."
      - alert: GatewayLatencyBurnRateTicket
        expr: |
          slo:gateway_slow_ratio:rate1d > (3 * 0.05)
          and
          slo:gateway_slow_ratio:rate2h > (3 * 0.05)
        for: 2m
        labels:
          severity: ticket
          slo: latency
        annotations:
          summary: "Slow error budget burn (latency) at the gateway"
          description: "The latency budget is being consumed 3 times faster than sustainable (1d and 2h). Open a ticket and investigate."

  - name: resilience-patterns
    rules:
      - alert: CircuitBreakerOpen
        expr: max by (name) (resilience_circuit_breaker_state{state="open"}) == 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Circuit breaker {{ $labels.name }} aberto"
          description: "The {{ $labels.name }} dependency has been rejected by the circuit breaker for over 1 minute. The gateway answers 503 with Retry-After."
      - alert: CircuitBreakerFlapping
        expr: sum by (name) (increase(resilience_circuit_breaker_transitions_total{to_state="open"}[15m])) >= 3
        labels:
          severity: ticket
        annotations:
          summary: "Circuit breaker {{ $labels.name }} oscilando"
          description: "The {{ $labels.name }} circuit breaker opened 3 or more times in 15 minutes: the dependency is unstable, not down."
      - alert: RateLimiterRedisDegraded
        expr: sum(rate(resilience_rate_limit_backend_total{backend=~"memory_fallback|fail_open|fail_closed"}[2m])) > 0
        for: 2m
        labels:
          severity: ticket
        annotations:
          summary: "Rate limiter operando sem Redis"
          description: "The rate limiter fell back (per-instance memory, fail-open or fail-closed). Limits are no longer global."
      - alert: RateLimiterFailClosed
        expr: sum(rate(resilience_rate_limit_backend_total{backend="fail_closed"}[1m])) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Rate limiter blocking traffic because Redis failed"
          description: "Fail-closed mode is refusing requests because Redis is down."
      - alert: HighRateLimiting
        expr: |
          sum(rate(resilience_rate_limit_decisions_total{result="limited"}[10m]))
          / clamp_min(sum(rate(resilience_rate_limit_decisions_total[10m])), 1e-9) > 0.1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "More than 10% of requests receive 429"
          description: "Pode ser abuso de um cliente ou limite configurado baixo demais para a carga real."
      - alert: BulkheadRejecting
        expr: sum by (name) (rate(resilience_bulkhead_rejected_total[5m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Bulkhead {{ $labels.name }} rejeitando chamadas"
          description: "The {{ $labels.name }} dependency is saturated: calls exceed the configured concurrency and queue."
      - alert: RetryBudgetExhausted
        expr: sum by (name) (rate(resilience_retry_events_total{event="budget_denied"}[5m])) > 0.1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Retry budget exhausted on {{ $labels.name }}"
          description: "Retries are being denied by the budget: the system is avoiding a retry storm against a failing dependency."
      - alert: DeadlineExceededSpike
        expr: sum by (where) (rate(resilience_deadline_exceeded_total[5m])) > 0.5
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Requests exceeding the deadline ({{ $labels.where }})"
          description: "Many requests run out of time before the chain of calls finishes."
